<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Source SVG for the OG/Twitter share card.
       Export to share-card.png (1200x630) and place in pictures/ before deploying.
       Most social platforms (LinkedIn, Twitter/X, Slack, iMessage) require a raster image. -->
  <defs>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbMag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0L0 0 0 48" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#05060A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="120" cy="100" rx="500" ry="500" fill="url(#orbCyan)"/>
  <ellipse cx="1080" cy="560" rx="500" ry="500" fill="url(#orbMag)"/>

  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none"
        stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2"/>

  <text x="72" y="100" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"
        font-size="28" font-weight="500" fill="#22D3EE">&gt; william.hatcher_</text>

  <text x="72" y="190" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"
        font-size="26" font-weight="500" fill="#9CA3AF">// embedded.systems.engineer //</text>

  <text x="72" y="290" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"
        font-size="86" font-weight="700" fill="#E6EDF3">William <tspan fill="#22D3EE">Hatcher</tspan></text>

  <text x="72" y="370" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"
        font-size="34" font-weight="500" fill="#22D3EE">Embedded &amp; Systems Software Engineer_</text>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"
     font-size="22" fill="#E6EDF3">
    <rect x="72" y="430" width="280" height="48" rx="24" fill="#0B0F1A" stroke="#22D3EE" stroke-opacity="0.35"/>
    <circle cx="100" cy="454" r="6" fill="#A3E635"/>
    <text x="116" y="461">currently @ Geotab</text>

    <rect x="370" y="430" width="370" height="48" rx="24" fill="#0B0F1A" stroke="#22D3EE" stroke-opacity="0.35"/>
    <text x="390" y="461">Queen's BEng '26 → Imperial MSc</text>

    <rect x="758" y="430" width="200" height="48" rx="24" fill="#0B0F1A" stroke="#22D3EE" stroke-opacity="0.35"/>
    <text x="778" y="461">Oakville, ON</text>
  </g>

  <text x="72" y="560" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"
        font-size="22" fill="#9CA3AF">williamhatcher.ca</text>
  <text x="1128" y="560" text-anchor="end"
        font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"
        font-size="22" fill="#D946EF">// build.log</text>
</svg>
